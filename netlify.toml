# Netlify configuration for Next.js project
[build]
  command = "npm run build"
  publish = ".next"

# O type-check do Next.js estoura o limite padrão de heap do Node durante o
# build (mesmo erro reproduzido localmente: "JavaScript heap out of memory"
# logo após "Checking validity of types ..." — sem stack trace, processo só
# morre). Aumenta o limite disponível para essa etapa.
[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

# @netlify/plugin-nextjs handles SSR, API routes, ISR and asset routing for Next.js 13+
[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  autoLaunch = false

# ============================================================================
# REDIRECTS - ORDEM IMPORTA! (Mais específicas PRIMEIRO)
# ============================================================================
# 💡 Regra de Ouro: Netlify processa redirects de cima para baixo
#    Primeira regra que matchear, vence!
#    Mais específicas (exatas) devem estar antes de wildcard patterns

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 1️⃣ REDIRECTS ESPECÍFICOS HUNGARIAN (Bloqueio de Páginas Fantasma)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# "Pomerániai" em húngaro → Redireciona para catálogo de filhotes
[[redirects]]
  from = "/pomeraniai"
  to = "/filhotes"
  status = 301
  force = true

# "Prémium kölyökkutyák elérhetők" em húngaro → Redireciona para filhotes
[[redirects]]
  from = "/premium-kolyokkutyak-elerhetok"
  to = "/filhotes"
  status = 301
  force = true

# Variações com hífens e parâmetros do URL antigo
[[redirects]]
  from = "/pomeraniai-*"
  to = "/filhotes"
  status = 301
  force = true

[[redirects]]
  from = "/kolyokkutyak*"
  to = "/filhotes"
  status = 301
  force = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 2️⃣ BLOQUEIO TOTAL DE ROTAS /HU/* (Qualquer idioma húngaro)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Captura /hu/* e qualquer blog post com sufixo -hu

[[redirects]]
  from = "/hu/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*-hu"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*-hu-HU"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "*-hu"
  to = "/"
  status = 301
  force = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 3️⃣ REDIRECTS DE ADMIN (Rota Protegida)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# /admin (sem trailing slash) → /admin/login
# Isso força login para qualquer acesso direto a /admin

[[redirects]]
  from = "/admin"
  to = "/admin/login"
  status = 307
  force = false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 4️⃣ REDIRECTS DE ROTAS ANTIGAS / QUEBRADAS (Prevenção de 404)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Redirecionamentos de termos antigos/misspellings comuns
[[redirects]]
  from = "/spitz"
  to = "/filhotes"
  status = 301
  force = true

[[redirects]]
  from = "/puppies"
  to = "/filhotes"
  status = 301
  force = true

# /galeria NAO entra aqui. Este bloco e para rota que nao existe; /galeria
# existe (app/(public)/galeria/page.tsx) e o `force = true` fazia o redirect
# ganhar da pagina real, entao o menu e o rodape caiam em /filhotes e os
# videos ficavam inalcancaveis.

[[redirects]]
  from = "/preco"
  to = "/preco-spitz-anao"
  status = 301
  force = true

[[redirects]]
  from = "/reservar"
  to = "/reserve-seu-filhote"
  status = 301
  force = true

[[redirects]]
  from = "/sobre-nos"
  to = "/sobre"
  status = 301
  force = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 5️⃣ ROTEAMENTO NEXT.JS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# @netlify/plugin-nextjs (declarado acima) cria automaticamente as funções
# serverless necessárias para SSR, API routes e ISR.
# Nenhum redirect manual para /.netlify/functions/server é necessário.

# ============================================================================
# HEADERS - Segurança e SEO
# ============================================================================

# Headers para /admin/* - Bloqueio de indexação e proteção
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache, no-store, must-revalidate, private"

# Headers para /api/admin/* - Segurança
[[headers]]
  for = "/api/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache, no-store, must-revalidate, private"

# Headers para arquivos estáticos - Cache agressivo
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para as fotos em public/images.
#
# Quem serve public/ na Netlify e o CDN, nao o runtime do Next -- entao e este
# bloco que vale, e nao a regra equivalente do next.config.mjs. Os dois estavam
# se contradizendo: la mandava cachear por um ano, aqui por um dia com
# `must-revalidate`. Valia o dia, e cada visitante recorrente rebaixava todas as
# fotos a cada 24h. Como 90% do trafego e mobile, isso e banda paga a toa.
#
# 30 dias com `stale-while-revalidate`: a foto trocada NO MESMO caminho pode
# demorar ate 30 dias para chegar em quem ja visitou. Foto nova em arquivo novo
# aparece na hora -- so a substituicao no mesmo nome e afetada.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

