# CI unico do projeto.
#
# Substitui quatro workflows que nao entregavam sinal:
#   - ci-debug.yml e deploy-debug.yml: quase identicos, rodavam o build so para
#     salvar o log como artefato, e um deles ainda tinha um job "hello" que so
#     dava echo. Falhavam em todo push (o build quebrava em "collect page data"
#     por causa de um cliente de SDK criado no escopo do modulo).
#   - deploy-vercel.yml: apontava para a Vercel; o site e publicado na Netlify.
#   - encoding-check.yml: o job de qualidade dependia do de encoding, e a
#     checagem de encoding reprovava portugues escrito corretamente. Como ela
#     nunca passava, o job de qualidade nunca chegou a rodar.
#
# O que este arquivo garante em cada push: o codigo tipa, passa nos testes, nao
# tem mojibake nem palavra banida, e o build de producao fecha -- com o mesmo
# Node e o mesmo limite de heap da Netlify, para o resultado aqui valer alguma
# coisa la.
#
# Cada checagem e um passo separado de proposito. O `check:all` do package.json
# encadeia tudo com `&&`: o primeiro que falha esconde os outros, e o log so
# mostra um erro quando podia mostrar quatro.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Push em sequencia cancela a execucao anterior: o que importa e o estado atual
# do branch, nao a fila de commits intermediarios.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Qualidade e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Le a versao de .nvmrc em vez de repetir o numero aqui.
          #
          # O CI ficou preso no Node 20 depois que o projeto migrou para o 24:
          # package.json passou a exigir "engines": ">=24 <25", netlify.toml
          # passou a NODE_VERSION = "24", e o workflow continuou em 20. Um CI
          # verde em runtime diferente do deploy nao prova nada sobre o deploy
          # -- e o jeito de isso nao voltar a acontecer e nao ter um segundo
          # lugar onde escrever a versao.
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Encoding
        run: npm run check:encoding

      - name: Palavras banidas
        run: npm run check:banned-words

      # Catalogo: slug duplicado, imagem que nao existe em public/, status fora
      # do vocabulario, cor publicada fora da tabela de precos. Roda aqui alem
      # de no prebuild para dar log proprio -- encadeado no build, a falha
      # aparece no meio de 200 linhas de compilacao.
      - name: Catalogo
        run: npm run catalog:audit

      # Verdade publica: o que o canil afirma que entrega, faz ou possui.
      #
      # O content-guard.mjs pula `/^src\//` inteiro -- as secoes da home, os
      # textos por cor e os templates do agente de WhatsApp nunca passaram por
      # checagem nenhuma. Foi la que estavam "Entregamos em ${cidade} sem
      # burocracia" e "Entrega humanizada", num repositorio onde o canil nao
      # opera transporte.
      #
      # A regra e de frase, nao de palavra: um artigo pode explicar o que e
      # luxacao de patela; o que nao passa e a By Imperio Dog dizer que faz o
      # exame. A matriz vive em src/domain/public-truth.ts e tem teste nos dois
      # sentidos (tests/public-truth.test.ts) -- guard que acusa texto correto
      # e desligado na primeira pressa.
      #
      # Falha fechada: zero arquivo verificado sai com exit 1, nao com aprovado.
      - name: Verdade publica
        run: npm run truth:guard

      # Portao de verdade desde 26/08/2026.
      #
      # Este passo nasceu com `continue-on-error: true` porque o repositorio
      # tinha ~590 erros de lint herdados e um CI que nasce vermelho volta a ser
      # ignorado. A fila de erros foi zerada; o que restou sao avisos, e aviso
      # nao reprova o eslint. Entao o `continue-on-error` saiu: a partir daqui,
      # erro de lint reprova o job.
      #
      # Os ~1.160 avisos continuam no log de proposito. Eles medem a divida sem
      # travar ninguem, e o dia em que virarem erro sera uma decisao explicita,
      # nao um efeito colateral.
      - name: Lint
        run: npm run lint

      # Sem etapa separada de contentlayer: o "prebuild" do package.json ja roda
      # content-guard, as fotos de cliente, o wrapper do contentlayer e o
      # gen-contentlayer antes do next build.
      - name: Build de producao
        run: npm run build
        env:
          # Mesmo valor do netlify.toml. Sem isso o "Checking validity of types"
          # estoura o heap padrao do Node e o build morre com
          # "Ineffective mark-compacts near heap limit" -- reproduzido local.
          NODE_OPTIONS: --max-old-space-size=4096

      # Smoke do site publico, contra a saida de producao que acabou de ser
      # construida -- nao contra o dev server.
      #
      # Cobre o que teste unitario nao alcanca: preco que chega ao HTML,
      # JSON-LD realmente servido, rota que responde 200, CTA apontando para o
      # numero do canil. Foi este passo que encontrou a pagina do filhote
      # publicando o preco com espaco sem quebra enquanto a tabela publicava o
      # mesmo preco com espaco comum -- identicos na tela, diferentes como
      # texto, e por isso invisiveis para qualquer checagem escrita.
      #
      # Regra de seguranca, repetida dentro do proprio spec: o smoke NAO clica
      # em CTA de WhatsApp, NAO envia formulario e NAO toca em pagamento. Um
      # clique gravaria conversao de verdade na conta de Google Ads do canil.
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke publico
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium
        env:
          PLAYWRIGHT_WEB_SERVER: npm run start
